<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>جاري التحويل...</title>
    <script type="text/javascript">
      // GitHub Pages SPA router redirect
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var target = l.protocol + '//' + l.host + (repoName ? '/' + repoName : '') + '/';
      if (l.search) target += l.search;
      if (l.hash) target += l.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">جاري توجيهك إلى النظام...</p>
  </body>
</html>
